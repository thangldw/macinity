name: Bug report
description: Report a reproducible Macinity problem without exposing private paths or files.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible problem. For a security issue, use [private vulnerability reporting](https://github.com/thangldw/macinity/security/advisories/new) instead.

        Do not paste private paths, filenames, file contents, account data, credentials, signing material, or an unredacted Macinity export.
  - type: input
    id: toolbox-version
    attributes:
      label: Macinity version
      description: Use the version shown in Settings or the GitHub release tag.
      placeholder: v3.1.0
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Affected workflow
      options:
        - Storage
        - Projects
        - Applications
        - Install Trace
        - Change Timeline
        - Recovery
        - Settings or onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the visible result and any exact non-private error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest sequence that reproduces the problem. Replace personal paths with placeholders.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private paths, filenames, file contents, account data, credentials, and signing material.
          required: true
    validations:
      required: true
