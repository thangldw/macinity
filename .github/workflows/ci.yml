name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: macinity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macinity:
    name: Macinity macOS
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/macinity
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Lint
        run: swift format lint --recursive --parallel Sources Tests Package.swift
      - name: Unit tests
        run: swift test
      - name: Smoke tests
        run: |
          ./scripts/test_core.sh
          ./scripts/test_storage.sh
          ./scripts/test_changes.sh
          ./scripts/test_app.sh
          ./scripts/test_monitoring.sh
          ./scripts/lint_localizations.swift
      - name: Release build
        run: swift build -c release
      - name: Assemble app bundle
        run: |
          ./scripts/build_app.sh
          test -x dist/Macinity.app/Contents/MacOS/Macinity
          test -f dist/Macinity.app/Contents/Resources/en.lproj/Localizable.strings
          test -f dist/Macinity.app/Contents/Resources/vi.lproj/Localizable.strings
          plutil -lint Resources/Info.plist Resources/en.lproj/*.strings Resources/vi.lproj/*.strings
          codesign --verify --deep --strict dist/Macinity.app
