name: Release

on:
  push:
    tags:
      - "v3.0.0"
  workflow_dispatch:

concurrency:
  group: toolbox-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate exact source
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/toolbox
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Require the supported release tag
        run: test "$GITHUB_REF" = "refs/tags/v3.0.0"
      - name: Format
        run: swift format lint --recursive --parallel Sources Tests Package.swift
      - name: XCTest
        run: swift test
      - name: Smoke contracts
        run: |
          ./scripts/test_core.sh
          ./scripts/test_storage.sh
          ./scripts/test_changes.sh
          ./scripts/test_app.sh
          ./scripts/test_monitoring.sh
          ./scripts/lint_localizations.swift
      - name: Universal release contract
        run: |
          ./scripts/build_universal.sh
          ./Tests/Distribution/release_contract.sh dist/Orven.app
      - name: Public release contracts
        working-directory: .
        run: |
          bash tests/site_contract.sh
          bash tests/launch_assets.sh

  release:
    name: Build and publish ad-hoc Orven release
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/toolbox
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Build and verify exact unsigned artifacts
        run: |
          ./scripts/build_universal.sh
          ./scripts/build_dmg.sh
          ./scripts/verify_release.sh --allow-adhoc

      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Orven-3.0.0.dmg \
            dist/Orven-3.0.0.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file ../../docs/launch/orven-3.0.0.md \
            --latest \
            --title "Orven 3.0.0"
